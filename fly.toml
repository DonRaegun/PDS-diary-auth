# fly.toml app configuration file generated for pds-diary on 2026-11-03T09:29:45+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'pds-diary-auth'
primary_region = 'nrt'

[build]
[env]
  PDS_DB = '/data/diary.sqlite'
  PORT = '8080'

[[mounts]]
  source = 'pds_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
